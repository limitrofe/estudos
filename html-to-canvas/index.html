<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-in-Canvas + Three.js Demo</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #css-renderer {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to UI elements inside */
        }

        /* Glass UI Element */
        .glass-panel {
            width: 400px;
            height: 500px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: auto; /* Enable interaction for this element */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            user-select: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-panel:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f56;
            box-shadow: 0 0 10px #ff5f56;
        }
        .dot:nth-child(2) { background: #ffbd2e; box-shadow: 0 0 10px #ffbd2e; }
        .dot:nth-child(3) { background: #27c93f; box-shadow: 0 0 10px #27c93f; }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 242, 255, 0.05);
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4);
        }

        .badge {
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
        }

        /* Info overlay */
        #info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            max-width: 400px;
        }

        #info h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        #info p {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* Overlay for interaction hint */
        #hint {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="hint">Mova o mouse para orbitar</div>
    
    <div id="info">
        <h2>HTML-in-Canvas Experimental</h2>
        <p>Este exemplo simula a integração perfeita entre HTML e WebGL. Atualmente usamos CSS3DRenderer, mas o futuro da web permitirá renderizar elementos reais diretamente como texturas de GPU.</p>
        <div class="badge">WICG Proposal</div>
    </div>

    <div id="webgl-canvas"></div>
    <div id="css-renderer"></div>

    <!-- This template will be used by JS to create the 3D object -->
    <template id="glass-template">
        <div class="glass-panel">
            <div class="header">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <h1>Interactive Hologram</h1>
            <p>O <b>HTML-in-Canvas</b> permite que você use CSS e HTML reais dentro do pipeline de renderização do WebGL/WebGPU.</p>
            
            <div class="input-group">
                <label>Seu Nome</label>
                <input type="text" placeholder="Digite algo...">
            </div>

            <div class="input-group">
                <label>Nível de Brilho</label>
                <input type="range" min="0" max="100" value="50">
            </div>

            <button onclick="alert('HTML Interativo no 3D!')">Ativar Sistema</button>
        </div>
    </template>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { CSS3DRenderer, CSS3DObject } from 'three/examples/jsm/renderers/CSS3DRenderer.js';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

        // --- Configuration ---
        let scene, camera, renderer, cssRenderer, controls;
        let starField, hologram;

        init();
        animate();

        function init() {
            // 1. Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 500;

            // 2. WebGL Renderer (for background/3D)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('webgl-canvas').appendChild(renderer.domElement);

            // 3. CSS3D Renderer (for HTML)
            cssRenderer = new CSS3DRenderer();
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('css-renderer').appendChild(cssRenderer.domElement);

            // 4. Controls
            controls = new OrbitControls(camera, cssRenderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;

            // 5. Background - Starfield
            createStarField();

            // 6. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00f2ff, 1);
            pointLight.position.set(200, 200, 200);
            scene.add(pointLight);

            // 7. Create Hologram (The HTML part)
            createHologram();

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function createStarField() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 5000; i++) {
                vertices.push(
                    THREE.MathUtils.randFloatSpread(2000),
                    THREE.MathUtils.randFloatSpread(2000),
                    THREE.MathUtils.randFloatSpread(2000)
                );
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0x888888, size: 2 });
            starField = new THREE.Points(geometry, material);
            scene.add(starField);
        }

        function createHologram() {
            const template = document.getElementById('glass-template');
            const element = template.content.cloneNode(true).firstElementChild;
            
            // Create CSS3DObject
            hologram = new CSS3DObject(element);
            hologram.position.set(0, 0, 0);
            scene.add(hologram);

            // Create a plane to act as a "shadow" or backing for WebGL integration
            // This allows WebGL objects to interact with the space the HTML occupies
            const planeGeom = new THREE.PlaneGeometry(400, 500);
            const planeMat = new THREE.MeshBasicMaterial({ 
                color: 0x000000, 
                opacity: 0, 
                transparent: true,
                side: THREE.DoubleSide,
                blending: THREE.NoBlending
            });
            const mesh = new THREE.Mesh(planeGeom, planeMat);
            scene.add(mesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Subtle floating animation
            if (hologram) {
                hologram.position.y = Math.sin(time) * 10;
                hologram.rotation.y = Math.sin(time * 0.5) * 0.1;
                hologram.rotation.x = Math.cos(time * 0.3) * 0.05;
            }

            // Rotate starfield
            if (starField) {
                starField.rotation.y += 0.0005;
            }

            controls.update();

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
    </script>
</body>
</html>
