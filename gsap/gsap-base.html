<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GSAP Básico</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: white; text-align: center; padding: 100px; }
    h1 { font-size: 3rem; opacity: 1; transform: translateY(50px); color: aliceblue;}
  </style>
</head>
<body>
  <h1>Olá com GSAP 3.13</h1>
<section style="height: 100vh;"></section>
  <script>
    gsap.from("h1", {
      duration: 5,
      opacity: 0,
      y: 50,
      ease: "power2.out"
    });
  </script>
</body>
</html>
