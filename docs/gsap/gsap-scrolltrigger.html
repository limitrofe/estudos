<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>ScrollTrigger</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>
  <style>
    body { height: 500vh; margin: 0; font-family: sans-serif; }
    .box {
      width: 100px;
      height: 100px;
      background: red;
      margin: 200px auto;
    }
  </style>
</head>
<body>
    <section style="height: 100vh;"><div><h1>rola pra baixo meu filho</h1></div></section>
  <div class="box"></div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    gsap.to(".box", {
      scrollTrigger: {
        trigger: ".box",
        start: "top 60%",
        end: "bottom 40%",
        toggleActions: "play none none reverse"
      },
      rotation: 360,
      scale: 2,
      duration: 1
    });
  </script>
</body>
</html>
